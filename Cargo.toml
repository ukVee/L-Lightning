[workspace]
resolver = "2"
members = [
    "poc",
    "crates/core",
    "crates/daemon",
    "crates/cli",
    "crates/tui",
]

[workspace.dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
